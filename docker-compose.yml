# Despliegue por defecto: CPU. Para GPU NVIDIA:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  app:
    build:
      context: .
      args:
        WITH_MARKER: "${WITH_MARKER:-true}"   # "false" para la imagen ligera sin OCR
        # "true" compila llama-server CON CUDA: necesario para el modo
        # `balanced` de Marker, que es el que usa la GPU y da la mejor calidad.
        WITH_LLAMA_SERVER: "${WITH_LLAMA_SERVER:-false}"
        # Arquitectura CUDA del servidor de destino, solo se usa si
        # WITH_LLAMA_SERVER=true. 75 = Turing (Quadro RTX 8000, RTX 20xx, T4);
        # 80 = A100; 86 = RTX 30xx/A6000; 89 = RTX 40xx/L4.
        CUDA_ARCHITECTURES: "${CUDA_ARCHITECTURES:-75}"
    image: doc2md:latest
    restart: unless-stopped
    # La app no tiene autenticación: se publica solo en la interfaz de loopback
    # del host. Para exponerla en la red, cambiar a "${PORT:-8000}:8000" y poner
    # delante un proxy inverso que resuelva el acceso.
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      # Trabajos simultáneos. Con Marker dejar en 1: un solo documento ya
      # satura la GPU/CPU y dos en paralelo solo se estorban.
      WORKERS: "${WORKERS:-1}"
      # Vacío = marker elige por dispositivo (fast en CPU, balanced en GPU).
      # "balanced" a mano requiere el binario llama-server en la imagen.
      MARKER_MODE: "${MARKER_MODE:-}"
      MARKER_TIMEOUT_S: "${MARKER_TIMEOUT_S:-14400}"
      # Modo auto: cuándo un PDF nativo con páginas escaneadas va a Marker.
      DOC2MD_MIXTO_MIN_PAGINAS: "${DOC2MD_MIXTO_MIN_PAGINAS:-2}"
      DOC2MD_MIXTO_MIN_RATIO: "${DOC2MD_MIXTO_MIN_RATIO:-0.10}"
      DOC2MD_COBERTURA_ESCANEO: "${DOC2MD_COBERTURA_ESCANEO:-0.5}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-500}"
      RETENTION_DAYS: "${RETENTION_DAYS:-14}"
      # Cada cuántas horas se borran los trabajos que pasaron RETENTION_DAYS.
      PURGE_INTERVAL_H: "${PURGE_INTERVAL_H:-6}"
      # Backend del VLM de Marker. Con GPU NVIDIA surya elegiría "vllm", que
      # lanza `docker run` y dentro del contenedor no hay docker. El código ya
      # fija llamacpp por defecto; se deja aquí visible por si hay que cambiarlo.
      SURYA_INFERENCE_BACKEND: "${SURYA_INFERENCE_BACKEND:-llamacpp}"
      # Captioning de imágenes. Por defecto "ollama": el modelo corre en TU
      # servidor y las imágenes no salen de la máquina.
      CAPTION_BACKEND: "${CAPTION_BACKEND:-ollama}"
      # host.docker.internal resuelve al host gracias al extra_hosts de abajo.
      # Apuntar a "localhost" desde dentro del contenedor NO funciona: sería el
      # propio contenedor, no el servidor.
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
      CAPTION_MODEL: "${CAPTION_MODEL:-qwen3-vl:32b}"
      OLLAMA_TIMEOUT_S: "${OLLAMA_TIMEOUT_S:-300}"
      # Ollama serializa: más hilos no aceleran y pueden agotar la VRAM.
      CAPTION_WORKERS: "${CAPTION_WORKERS:-1}"
      CAPTION_MIN_PX: "${CAPTION_MIN_PX:-64}"
      CAPTION_MAX_PX: "${CAPTION_MAX_PX:-1024}"
      # Solo si CAPTION_BACKEND=anthropic (las imágenes saldrían a un tercero).
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    # Hace que host.docker.internal apunte al host también en Linux, donde
    # Docker no lo define solo (en Mac y Windows ya existe).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Subidas, resultados, base de datos de trabajos y caché de pesos del
      # modelo. Todo el estado vive aquí; el contenedor es desechable.
      - doc2md-data:/data

volumes:
  doc2md-data:
