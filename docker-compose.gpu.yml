# Override para servidor con GPU NVIDIA. Requiere el NVIDIA Container Toolkit
# instalado en el host (`nvidia-ctk`); no hace falta reconstruir la imagen: los
# wheels de torch que instala marker-pdf en linux/amd64 ya traen CUDA.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Para no repetir los -f en cada comando, en el .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#
# Verificar que la GPU llega al contenedor (los dos deben responder):
#   docker compose exec app nvidia-smi
#   docker compose logs app | grep "conversión:"      # debe decir "GPU <modelo>"
services:
  app:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # TORCH_DEVICE se omite A PROPÓSITO, no se deja vacío: comprobado que
      # `TORCH_DEVICE=` llega a marker como '' y no como None, que no es lo
      # mismo que no definirlo. Torch detecta CUDA solo cuando la GPU llega al
      # contenedor; y forzar "cuda" donde no llega (p. ej. NVML roto por
      # cgroups) convertiría una degradación silenciosa a CPU en un fallo duro
      # de TODAS las conversiones. Para forzarlo, añadirlo aquí a conciencia.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
