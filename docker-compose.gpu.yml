# Override para servidor con GPU NVIDIA. Requiere el NVIDIA Container Toolkit
# instalado en el host (`nvidia-ctk`), no hace falta reconstruir la imagen: los
# wheels de torch que instala marker-pdf en linux/amd64 ya traen CUDA.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Verificar que la GPU se ve desde el contenedor:
#   docker compose exec app python -c "import torch; print(torch.cuda.is_available(), torch.cuda.get_device_name(0))"
services:
  app:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TORCH_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
