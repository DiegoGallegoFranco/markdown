[pytest]
# La raíz del repo en sys.path para importar `pipeline` y `webapp` sin instalar.
pythonpath = .
testpaths = tests
# Sin .pytest_cache dentro del repo.
addopts = -p no:cacheprovider
filterwarnings =
    ignore:The `fitz` API is deprecated:DeprecationWarning
    ignore:builtin type Swig:DeprecationWarning
    ignore:builtin type swigvarlink:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
