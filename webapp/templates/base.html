<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Documentos → Markdown{% endblock %}</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --border: #e2ded7; --text: #1c1a17;
    --muted: #6b655c; --accent: #9a5b33; --accent-soft: #f3e9e2;
    --ok: #2f6b45; --warn: #8a6d1f; --err: #a33b2e;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a; --panel: #1e1d23; --border: #33313a; --text: #ece9e4;
      --muted: #9a948c; --accent: #d99a6c; --accent-soft: #2c2620;
      --ok: #6bbf8a; --warn: #d6b45c; --err: #e08472;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { border-bottom: 1px solid var(--border); margin-bottom: 2rem; padding-bottom: 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  h2 { font-size: 1.1rem; margin: 2rem 0 .75rem; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: .9rem; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 1.25rem;
  }
  label { display: block; font-weight: 600; margin: 1rem 0 .35rem; font-size: .92rem; }
  input[type=file], select {
    width: 100%; padding: .55rem; border: 1px solid var(--border);
    border-radius: 7px; background: var(--bg); color: var(--text); font: inherit;
  }
  .check { display: flex; align-items: center; gap: .5rem; font-weight: 400; margin-top: 1rem; }
  .check input { width: auto; margin: 0; }
  button, .btn {
    display: inline-block; background: var(--accent); color: #fff; border: 0;
    padding: .6rem 1.1rem; border-radius: 7px; font: inherit; font-weight: 600;
    cursor: pointer; text-decoration: none; margin-top: 1.25rem;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; }
  .tabla-scroll { overflow-x: auto; }
  .badge {
    display: inline-block; padding: .1rem .5rem; border-radius: 999px;
    font-size: .78rem; font-weight: 600; background: var(--accent-soft); color: var(--accent);
  }
  .badge.done { color: var(--ok); } .badge.error { color: var(--err); }
  .badge.running { color: var(--warn); }
  pre.log {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: .9rem; overflow-x: auto; font-family: var(--mono); font-size: .82rem;
    line-height: 1.5; max-height: 26rem; overflow-y: auto; margin: 0;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: .75rem; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .7rem; }
  .stat b { display: block; font-size: 1.35rem; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .nota { background: var(--accent-soft); border-radius: 8px; padding: .75rem 1rem; font-size: .88rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="/" style="color:inherit;text-decoration:none">Documentos → Markdown</a></h1>
    <p class="muted">PDF, DOCX y PPTX a Markdown limpio, con imágenes extraídas y enlazadas.</p>
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
